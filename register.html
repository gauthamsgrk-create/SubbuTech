<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubbuTech</title>
    <script src="https://kit.fontawesome.com/1895c88440.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="subbutech.css">
    <link rel="icon" type="image/x-icon" href="">
</head>
<body>
    <header>
        
    <!--Start of Project-->

        <div class="logo">
            <img src="Images/Logo.png" alt="SubbuTech" width="200">
        </div>

        <!--Search box-->
        
        <div class="search-box">

    <input type="text" id="search" placeholder="Search mobiles, accessories...">
    <button>
        <i class="fa fa-search"></i>
    </button>
        <!--end of search bar-->

        <!--start of icon-->
    </div>

        <!-- Right Menu -->
<div class="right-menu">

    <!-- Login -->
    <a href="login.html" class="menu-item">
        <i class="fa-regular fa-user"></i>
        <div>
            <span>Login / Register</span>
        </div>
    </a>

    <!-- Wishlist -->
    <a href="wishlist.html" class="menu-item icon-box">
        <i class="fa-regular fa-heart"></i>
        <span class="count">0</span>
        <p>Wishlist</p>
    </a>

    <!-- Cart -->
    <a href="cart.html" class="menu-item icon-box">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="count">0</span>
        <p>Cart</p>
    </a>

</div>
    </header>
    <!--end of icon-->

<!--==================== REGISTER SECTION ====================-->

<section class="register-section">

    <div class="container register-container">

        <!-- Left Form -->

        <div class="register-form">

            <span class="register-tag">
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </span>

            <h2>Create Your <span>Account</span></h2>

            <p>
                Join Subbu Tech and enjoy shopping, exclusive offers,
                order tracking and much more.
            </p>

            <form>

                <div class="input-row">

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Full Name">
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="Email Address">
                    </div>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input type="text" placeholder="Phone Number">

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Password">


                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Confirm Password">

                    

                </div>

                <div class="terms">

                    <input type="checkbox">

                    <label>

                        I agree to the

                        <a href="#">Terms & Conditions</a>

                    </label>

                </div>

                <button class="register-btn">

                    <i class="fa-solid fa-user-plus"></i>

                    Register

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="social-register">

                <a href="#">

                    <i class="fa-brands fa-google"></i>

                    Google

                </a>

                <a href="#">

                    <i class="fa-brands fa-facebook-f"></i>

                    Facebook

                </a>

            </div>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login Now

                </a>

            </p>

        </div>

        <!-- Right Illustration -->

        <div class="register-image">

            <img src="Images/Register.png" alt="Register">

            <div class="register-features">

                <div>

                    <i class="fa-solid fa-gift"></i>

                    Exclusive Offers

                </div>

                <div>

                    <i class="fa-solid fa-truck"></i>

                    Track Orders

                </div>

                <div>

                    <i class="fa-solid fa-shield-halved"></i>

                    Safe & Secure

                </div>

            </div>

        </div>

    </div>

</section>
</body>
</html>
